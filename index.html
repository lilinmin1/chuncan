<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>春蚕食叶</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column — name + pause, instar stats strip, square mulberry-leaf board with overlay, d-pad on touch screens.
   Single committed light look: a fresh mulberry leaf in spring. */
:root{
  --paper:#EDF1E0;
  --board:#D6E5BA;
  --grid:#BDD19B;
  --leaf:#4B8937;
  --leaf-deep:#2B5920;
  --worm:#FBF7EA;
  --worm-line:#A69A70;
  --ink:#22301B;
  --muted:#5B6A4E;
  --gold:#C08B1F;
  --dew:#4A8DBF;
  --stone:#858A7C;
  --hurt:#B5543C;
  --veil:rgba(237,241,224,.86);
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:var(--f-body);
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--f-display);font-weight:400;font-size:2.3rem;line-height:1.1;margin:0;letter-spacing:.06em;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.stat .v{font-family:var(--f-num);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat .v.cn{font-family:var(--f-display);font-size:1.35rem}
.bar{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--leaf);transition:width .25s}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--dew);color:var(--worm);white-space:nowrap}
.board{position:relative;width:100%;max-width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--board);box-shadow:inset 0 0 0 1px var(--grid);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--veil)}
.overlay h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.06em}
.overlay p{margin:0;max-width:30ch;line-height:1.7;color:var(--muted)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--leaf-deep);color:var(--worm);border:0;border-radius:999px;padding:10px 26px;font-size:1rem;letter-spacing:.1em}
.btn:hover{background:var(--leaf)}
.ghost{background:transparent;color:var(--leaf-deep);border:1px solid var(--grid);border-radius:999px;padding:6px 16px;font-size:.9rem}
.ghost:hover{border-color:var(--leaf)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;color:var(--muted);font-size:.8rem;margin:0;padding:0;list-style:none}
.legend b{font-weight:500;color:var(--ink)}
.pad{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center}
.pad button{border:1px solid var(--grid);background:var(--board);color:var(--leaf-deep);border-radius:14px;font-size:1.3rem}
.pad button:active{background:var(--grid)}
.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .mid{grid-area:2/2;font-size:.85rem}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}
@media (pointer:coarse){.pad{display:grid}.hint.keys{display:none}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="name">
      <h1>春蚕食叶</h1>
      <span class="sub">吃满 40 片桑叶，吐丝结茧</span>
    </div>
    <button class="ghost" id="pauseBtn" type="button">暂停</button>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">桑叶</span><span class="v" id="sScore">0</span></div>
    <div class="stat"><span class="k">蚕龄</span><span class="v cn" id="sInstar">一龄</span></div>
    <div class="stat"><span class="k">离结茧</span><span class="v" id="sLeft">40</span></div>
    <div class="stat"><span class="k">最好成绩</span><span class="v" id="sBest">0</span></div>
  </div>
  <div class="bar">
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
    <span class="chip" id="slowChip" hidden>露水 · 减速中</span>
  </div>

  <div class="board" id="boardBox">
    <canvas id="board" aria-label="游戏画面"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">春蚕食叶</h2>
      <p id="ovText">方向键、WASD 或在叶面上滑动来控制蚕宝宝。爬出叶缘、撞上石子或咬到自己，这局就结束了。</p>
      <button class="btn" id="ovBtn" type="button">开始</button>
    </div>
  </div>

  <div class="pad" aria-label="方向键">
    <button class="up" type="button" data-d="0,-1" aria-label="上">▲</button>
    <button class="left" type="button" data-d="-1,0" aria-label="左">◀</button>
    <button class="mid" type="button" id="padPause">暂停</button>
    <button class="right" type="button" data-d="1,0" aria-label="右">▶</button>
    <button class="down" type="button" data-d="0,1" aria-label="下">▼</button>
  </div>

  <ul class="legend">
    <li><b>桑叶</b> 长一节，越长爬得越快</li>
    <li><b>露水</b> 减速 5 秒</li>
    <li><b>石子</b> 越往后冒得越多</li>
    <li><b>每 8 片</b> 蜕皮一次，升一龄</li>
  </ul>
  <p class="hint keys">方向键 / WASD 移动 · 空格暂停 · 回车开始</p>
</div>

<script>
(() => {
  const N = 20, GOAL = 40, PER_INSTAR = 8;
  const INSTARS = ['一龄', '二龄', '三龄', '四龄', '五龄'];
  const $ = s => document.querySelector(s);
  const css = getComputedStyle(document.documentElement);
  const C = {};
  ['board','grid','leaf','leaf-deep','worm','worm-line','ink','gold','dew','stone','hurt'].forEach(k => C[k] = css.getPropertyValue('--' + k).trim());
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cv = $('#board'), ctx = cv.getContext('2d');
  const box = $('#boardBox');
  const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
  let cell = 20, dpr = 1;

  let best = 0;
  try { best = +localStorage.getItem('chuncan-best') || 0; } catch (e) {}

  let snake, dir, queue, leaf, dew, stones, score, state, slowUntil, acc, last, pulse, endAt;
  const eq = (a, b) => a && b && a.x === b.x && a.y === b.y;
  const instar = () => Math.min(5, Math.floor(score / PER_INSTAR) + 1);

  function occupied(x, y) {
    const p = { x, y };
    return snake.some(s => eq(s, p)) || stones.some(s => eq(s, p)) || eq(leaf, p) || eq(dew, p);
  }
  function spawnFree(minDist) {
    const h = snake[0];
    for (let i = 0; i < 600; i++) {
      const x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
      if (!occupied(x, y) && Math.abs(x - h.x) + Math.abs(y - h.y) >= minDist) return { x, y };
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!occupied(x, y)) return { x, y };
    return null;
  }

  function reset() {
    snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
    dir = { x: 1, y: 0 }; queue = []; stones = []; leaf = null; dew = null;
    score = 0; slowUntil = 0; acc = 0; pulse = -1e9; endAt = 0;
    leaf = spawnFree(4);
    state = 'ready';
    ui();
  }

  function interval(now) {
    // 300ms per step at the start, 100ms at 40 leaves
    return Math.max(100, 300 - score * 5) + (now < slowUntil ? 100 : 0);
  }

  function step(now) {
    if (queue.length) dir = queue.shift();
    const h = snake[0], nh = { x: h.x + dir.x, y: h.y + dir.y };
    const grow = eq(nh, leaf);
    const body = grow ? snake : snake.slice(0, -1);
    if (nh.x < 0 || nh.y < 0 || nh.x >= N || nh.y >= N || stones.some(s => eq(s, nh)) || body.some(s => eq(s, nh))) {
      return end(now, false);
    }
    snake.unshift(nh);
    if (grow) {
      score++; pulse = now; leaf = null;
      if (score >= GOAL) return end(now, true);
      leaf = spawnFree(2);
      // stones pile up faster as the game goes on: 4 at 10 leaves, 12 at 20, 21 at 30, 32 at 39
      const target = Math.round(score / 3 + score * score / 80);
      while (stones.length < target) { const s = spawnFree(5); if (!s) break; stones.push(s); }
      if (!dew && Math.random() < 0.22) { const d = spawnFree(3); if (d) dew = { ...d, ttl: 45 }; }
    } else {
      snake.pop();
    }
    if (dew) {
      if (eq(dew, nh)) { slowUntil = now + 5000; dew = null; }
      else if (--dew.ttl <= 0) dew = null;
    }
    ui();
  }

  function end(now, won) {
    state = won ? 'win' : 'over';
    endAt = now;
    if (score > best) { best = score; try { localStorage.setItem('chuncan-best', best); } catch (e) {} }
    ui();
    if (won) showOverlay('结茧了', '40 片桑叶一片不剩。五龄蚕吐尽了丝，把自己裹成一枚茧。', '再养一只');
    else showOverlay('这局结束了', `吃了 ${score} 片桑叶，长到${INSTARS[instar() - 1]}。` + (score >= best && score > 0 ? '新的最好成绩。' : ''), '再来一局');
  }

  function start() {
    if (state === 'run') return;
    if (state === 'over' || state === 'win') reset();
    state = 'run'; acc = 0; last = performance.now();
    $('#overlay').hidden = true;
    ui();
  }
  function pause() {
    if (state !== 'run') return;
    state = 'pause';
    showOverlay('暂停中', `已经吃了 ${score} 片，还差 ${GOAL - score} 片结茧。`, '继续');
    ui();
  }
  function togglePause() { state === 'run' ? pause() : (state === 'pause' ? start() : null); }

  function showOverlay(t, p, b) {
    $('#ovTitle').textContent = t; $('#ovText').textContent = p; $('#ovBtn').textContent = b;
    $('#overlay').hidden = false;
  }

  function ui() {
    $('#sScore').textContent = score;
    $('#sInstar').textContent = state === 'win' ? '结茧' : INSTARS[instar() - 1];
    $('#sLeft').textContent = GOAL - score;
    $('#sBest').textContent = best;
    $('#prog').style.width = (score / GOAL * 100) + '%';
    const pb = state === 'pause' ? '继续' : '暂停';
    $('#pauseBtn').textContent = pb; $('#padPause').textContent = pb;
    $('#pauseBtn').disabled = !(state === 'run' || state === 'pause');
  }

  function turn(dx, dy) {
    if (state === 'over' || state === 'win') return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (ref.x === -dx && ref.y === -dy) return;
    if (!(ref.x === dx && ref.y === dy) && queue.length < 3) queue.push({ x: dx, y: dy });
    if (state !== 'run') start();
  }

  // ---------- drawing ----------
  function resize() {
    const w = box.clientWidth;
    dpr = window.devicePixelRatio || 1;
    cv.width = bg.width = Math.round(w * dpr);
    cv.height = bg.height = Math.round(w * dpr);
    cell = cv.width / N;
    // leaf-surface background: main vein, side veins, cell dots
    bctx.fillStyle = C.board; bctx.fillRect(0, 0, bg.width, bg.height);
    bctx.strokeStyle = C.grid; bctx.globalAlpha = 0.55; bctx.lineCap = 'round';
    bctx.lineWidth = cell * 0.16;
    bctx.beginPath(); bctx.moveTo(-cell, bg.height + cell); bctx.lineTo(bg.width + cell, -cell); bctx.stroke();
    bctx.lineWidth = cell * 0.08;
    for (let i = 1; i < 7; i++) {
      const t = i / 7, px = t * bg.width, py = bg.height - t * bg.height;
      bctx.beginPath(); bctx.moveTo(px, py); bctx.quadraticCurveTo(px + cell * 2, py + cell * 3, px + cell * 1.5, py + cell * 6); bctx.stroke();
      bctx.beginPath(); bctx.moveTo(px, py); bctx.quadraticCurveTo(px - cell * 3, py - cell * 2, px - cell * 6, py - cell * 1.5); bctx.stroke();
    }
    bctx.globalAlpha = 1; bctx.fillStyle = C.grid;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      bctx.beginPath(); bctx.arc((x + .5) * cell, (y + .5) * cell, cell * 0.055, 0, 7); bctx.fill();
    }
  }

  const cx = p => (p.x + .5) * cell, cy = p => (p.y + .5) * cell;

  function drawLeaf(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.fillStyle = C.leaf;
    ctx.beginPath(); ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.98, -s * 0.72, s * 0.92, s * 0.4, 0, s * 0.9);
    ctx.bezierCurveTo(-s * 0.92, s * 0.4, -s * 0.98, -s * 0.72, 0, -s);
    ctx.fill();
    ctx.strokeStyle = C['leaf-deep']; ctx.lineWidth = Math.max(1, s * 0.09); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -s * 0.7); ctx.lineTo(0, s * 1.15); ctx.stroke();
    for (const t of [-0.3, 0.15]) {
      ctx.beginPath();
      ctx.moveTo(0, s * t); ctx.lineTo(s * 0.45, s * (t - 0.28));
      ctx.moveTo(0, s * t); ctx.lineTo(-s * 0.45, s * (t - 0.28));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDew(p, now) {
    const x = cx(p), y = cy(p), s = cell * 0.36;
    ctx.save();
    if (p.ttl < 12) ctx.globalAlpha = 0.45 + 0.45 * Math.abs(Math.sin(now / 120));
    ctx.fillStyle = C.dew;
    ctx.beginPath(); ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x + s * 0.95, y + s * 0.2, x, y + s * 0.8);
    ctx.quadraticCurveTo(x - s * 0.95, y + s * 0.2, x, y - s);
    ctx.fill();
    ctx.fillStyle = C.worm; ctx.globalAlpha *= 0.7;
    ctx.beginPath(); ctx.ellipse(x - s * 0.2, y + s * 0.15, s * 0.12, s * 0.2, -0.4, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawStone(p) {
    const x = cx(p), y = cy(p);
    ctx.fillStyle = C.stone;
    ctx.beginPath(); ctx.ellipse(x, y + cell * 0.03, cell * 0.4, cell * 0.33, 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = C.worm; ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.ellipse(x - cell * 0.12, y - cell * 0.1, cell * 0.12, cell * 0.07, 0.3, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawWorm(now) {
    const r = cell * (0.33 + 0.03 * instar());
    const pts = snake.map(p => [cx(p), cy(p)]);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
    ctx.strokeStyle = C['worm-line']; ctx.lineWidth = r * 2 + 2 * dpr; path(); ctx.stroke();
    ctx.strokeStyle = C.worm; ctx.lineWidth = r * 2; path(); ctx.stroke();
    // segment creases
    ctx.strokeStyle = C['worm-line']; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2 * dpr;
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      const len = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / len, ny = (bx - ax) / len;
      const mx = (ax + bx) / 2, my = (ay + by) / 2, k = r * 0.75;
      ctx.beginPath(); ctx.moveTo(mx - nx * k, my - ny * k); ctx.lineTo(mx + nx * k, my + ny * k); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // crescent markings on the second segment, as real silkworms have
    if (pts.length > 2) {
      const [mx, my] = pts[2];
      ctx.fillStyle = C['worm-line']; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(mx, my, r * 0.32, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // head
    const [hx, hy] = pts[0];
    const hurt = state === 'over';
    ctx.fillStyle = C.worm; ctx.strokeStyle = hurt ? C.hurt : C['worm-line']; ctx.lineWidth = (hurt ? 2.5 : 1.2) * dpr;
    ctx.beginPath(); ctx.arc(hx, hy, r * 1.06, 0, 7); ctx.fill(); ctx.stroke();
    const fx = dir.x, fy = dir.y, sx = -fy, sy = fx;
    ctx.fillStyle = C.ink;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + fx * r * 0.38 + sx * side * r * 0.45, hy + fy * r * 0.38 + sy * side * r * 0.45, r * 0.13, 0, 7);
      ctx.fill();
    }
    if (now - pulse < 220) {
      ctx.fillStyle = C.leaf;
      ctx.beginPath(); ctx.arc(hx + fx * r * 0.95, hy + fy * r * 0.95, r * 0.22, 0, 7); ctx.fill();
    }
  }

  function drawCocoon(now) {
    const [hx, hy] = [cx(snake[0]), cy(snake[0])];
    const t = Math.min(1, (now - endAt) / (reduced ? 1 : 1400));
    const rx = cell * 1.7 * t, ry = cell * 1.15 * t;
    if (t <= 0) return;
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.atan2(dir.y, dir.x));
    ctx.fillStyle = C.worm; ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5 * dpr;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.lineWidth = dpr;
    for (let i = 0; i < 14; i++) {
      ctx.beginPath(); ctx.ellipse(0, 0, rx * (0.55 + (i % 4) * 0.12), ry * (0.5 + (i % 3) * 0.15), i * 0.45, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(now) {
    ctx.drawImage(bg, 0, 0);
    stones.forEach(drawStone);
    if (dew) drawDew(dew, now);
    if (leaf) drawLeaf(cx(leaf), cy(leaf), cell * 0.42, 0.35 + (reduced ? 0 : Math.sin(now / 520) * 0.12));
    drawWorm(now);
    if (state === 'win') drawCocoon(now);
    const slow = state === 'run' && now < slowUntil;
    const chip = $('#slowChip');
    if (chip.hidden === slow) chip.hidden = !slow;
  }

  function loop(now) {
    if (state === 'run') {
      acc += now - last;
      const iv = interval(now);
      if (acc > 1000) acc = iv;
      while (acc >= iv && state === 'run') { acc -= iv; step(now); }
    }
    last = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  const KEYS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    const k = e.key.toLowerCase();
    if (KEYS[k]) { e.preventDefault(); turn(...KEYS[k]); }
    else if (k === ' ' || k === 'p') { e.preventDefault(); togglePause(); }
    else if (k === 'enter' && state !== 'run') { e.preventDefault(); start(); }
  });

  let sw = null;
  box.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
  box.addEventListener('pointerup', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  });
  box.addEventListener('pointercancel', () => { sw = null; });

  document.querySelectorAll('.pad [data-d]').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = b.dataset.d.split(',').map(Number); turn(x, y); });
  });
  $('#padPause').addEventListener('click', togglePause);
  $('#pauseBtn').addEventListener('click', togglePause);
  $('#ovBtn').addEventListener('click', start);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  new ResizeObserver(resize).observe(box);
  reset();
  resize();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>

</body>
